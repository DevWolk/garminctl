name: Pull request

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows-tests.yml

  # Runs make check, then builds, installs and starts the packages.
  packages:
    name: Native packages
    uses: ./.github/workflows/packages.yml
    with:
      version: v0.0.0-ci

  codeql:
    # Dependabot's pull request token cannot upload scan results.
    if: github.actor != 'dependabot[bot]'
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
