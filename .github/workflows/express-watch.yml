# Monitor upstream releases for changes affecting supported Garmin services.
name: Garmin Express watch

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      copilot:
        description: Ask Copilot to assess a newly detected Garmin Express release
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      # Enables CI on generated PRs and the optional Copilot task.
      # Without it, open the PR with GITHUB_TOKEN and skip Copilot.
      WATCH_TOKEN: ${{ secrets.EXPRESS_WATCH_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ask Garmin's download server and the release-notes thread
        id: check
        run: go run ./tools/expresswatch -state docs/express-release.json -notes "$RUNNER_TEMP/notes.md" -output "$GITHUB_OUTPUT"

      - name: Open a pull request with the release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPRESS_WATCH_TOKEN || github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          branch="express/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/express-release.json
          git commit -m "Garmin Express $VERSION released"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Garmin Express $VERSION released" --body-file "$RUNNER_TEMP/notes.md"

      - name: Ask Copilot whether garminctl has to follow
        if: >-
          steps.check.outputs.changed == 'true' && env.WATCH_TOKEN != '' &&
          ((github.event_name == 'workflow_dispatch' && inputs.copilot) ||
           (github.event_name == 'schedule' && vars.EXPRESS_WATCH_COPILOT == 'true'))
        env:
          GH_TOKEN: ${{ secrets.EXPRESS_WATCH_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          {
            echo "Garmin Express $VERSION for Windows was released. Read README.md, AGENTS.md and docs/formats.md for garminctl's supported functionality."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Task: review changes affecting sync, device settings, Connect IQ apps, software updates or music. Verify relevant behavior against current code. Implement necessary fixes with tests, run make check and update the affected documentation. Summarize the assessment in the task response. Open a pull request against main only when source or documentation changes are needed; do not add historical release reports."
          } > "$RUNNER_TEMP/prompt.md"
          gh api -X POST "/agents/repos/${{ github.repository }}/tasks" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -F "prompt=@$RUNNER_TEMP/prompt.md" -f base_ref=main -F create_pull_request=true
