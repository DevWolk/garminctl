# Dependabot for the application garminctl replaces: once a day, see whether
# Garmin shipped a new Garmin Express for Windows. When it did, open a pull
# request that records the release and Garmin's change notes, and ask
# Copilot to check whether garminctl has to follow.
name: Garmin Express watch

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      # A personal token (repo scope, or fine-grained: contents, pull requests,
      # issues, actions read/write) does two things GITHUB_TOKEN cannot: the
      # pull request it opens triggers the CI workflows, and the Copilot step
      # below can start a task. Without it the PR still opens; CI has to be
      # started by hand and the Copilot step is skipped.
      WATCH_TOKEN: ${{ secrets.EXPRESS_WATCH_TOKEN }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Ask Garmin's download server and the release-notes thread
        id: check
        run: go run ./tools/expresswatch -state docs/express-release.json -notes "$RUNNER_TEMP/notes.md" -output "$GITHUB_OUTPUT"

      - name: Open a pull request with the release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXPRESS_WATCH_TOKEN || github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          branch="express/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/express-release.json
          git commit -m "Garmin Express $VERSION released"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "Garmin Express $VERSION released" --body-file "$RUNNER_TEMP/notes.md"

      - name: Ask Copilot whether garminctl has to follow
        if: steps.check.outputs.changed == 'true' && env.WATCH_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.EXPRESS_WATCH_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          {
            echo "Garmin Express $VERSION for Windows was released. garminctl replaces Garmin Express for one vívoactive 5 (see README.md, AGENTS.md and docs/formats.md)."
            echo
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "Task: decide for each listed change whether garminctl needs a matching change (syncing, device settings, Connect IQ apps, software updates, music, anything about the vívoactive 5). Support for other devices needs nothing. Implement what is needed with tests, run make check, and record the assessment for $VERSION in docs/express-parity.md (one dated section per Express version: the change, needed or not, why). Open a pull request against main even when nothing but the assessment changed."
          } > "$RUNNER_TEMP/prompt.md"
          gh api -X POST "/agents/repos/${{ github.repository }}/tasks" \
            -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
            -F "prompt=@$RUNNER_TEMP/prompt.md" -f base_ref=main -F create_pull_request=true
