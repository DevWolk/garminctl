# Prepares the environment Copilot coding agent works in, so `make check`
# runs there without the agent having to discover the toolchain itself.
# The job name is fixed: GitHub looks for `copilot-setup-steps`.
name: Copilot setup steps

on:
  workflow_dispatch:
  push:
    branches: [main] # tag pushes ignore path filters and would run this too
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Install native USB build headers
        run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev

      - name: Warm the module and tool caches
        run: |
          go mod download
          go build ./...
          go tool -modfile=tools.mod golangci-lint version
          go tool -modfile=tools.mod govulncheck -version
