name: Package verification

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      previous_version:
        type: string
        default: ''
      snapshot:
        type: boolean
        default: true
      signing_mode:
        type: string
        default: none
      sign_updates:
        type: boolean
        default: false
    secrets:
      WINDOWS_SIGNING_PFX_BASE64:
        required: false
      WINDOWS_SIGNING_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and check packages
    runs-on: ubuntu-latest
    env:
      # Public values of the Connect app; read by Make and GoReleaser.
      GARMIN_OAUTH_CONSUMER_KEY: ${{ vars.GARMIN_OAUTH_CONSUMER_KEY }}
      GARMIN_OAUTH_CONSUMER_SECRET: ${{ vars.GARMIN_OAUTH_CONSUMER_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Validate build options
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          SIGN_UPDATES: ${{ inputs.sign_updates }}
        run: |
          [[ "$PACKAGE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SIGNING_MODE" == none || "$SIGNING_MODE" == certificate ]]
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
            [[ "$PREVIOUS_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "${PREVIOUS_VERSION#v}" != "${PACKAGE_VERSION#v}" ]]
            if [[ "$SIGN_UPDATES" != true || "$SIGNING_MODE" != certificate ]]; then
              echo 'Previous native packages require existing certificate update-signing mode' >&2
              exit 1
            fi
          fi
          if [[ "$SIGN_UPDATES" == true && "$SIGNING_MODE" != certificate ]]; then
            echo 'Updater release requires existing Windows certificate mode' >&2
            exit 1
          fi
          printf 'APPLICATION_UPDATE_PUBLIC_KEY=%s\n' "$(cat build/update-public-key.b64)" >> "$GITHUB_ENV"
          printf 'PACKAGE_VERSION_NO_V=%s\n' "${PACKAGE_VERSION#v}" >> "$GITHUB_ENV"
      - name: Build toolchain and run quality gate
        run: |
          make image-build
          make check
      - name: Build native packages
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          WINDOWS_SIGNING_MODE: ${{ inputs.signing_mode }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            make package VERSION="$PREVIOUS_VERSION"
            mkdir -p dist/previous
            mv dist/*_setup.exe dist/*.deb dist/*.rpm dist/previous/
            docker compose -f docker/docker-compose.yml exec -T -e GITHUB_ACTIONS=true -e WINDOWS_SIGNING_MODE -e WINDOWS_SIGNING_PFX_BASE64 -e WINDOWS_SIGNING_PASSWORD go bash scripts/sign-update-packages.sh sign dist/previous --native-fixtures
          fi
          make package VERSION="$PACKAGE_VERSION"
      - name: Build portable archives without publishing
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.2
          args: release --clean --skip=publish ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ inputs.version }}
          WINDOWS_SIGNING_MODE: ${{ inputs.signing_mode }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
      - name: Assemble final assets
        run: |
          mkdir -p dist/assets
          cp dist/*_setup.exe dist/*.deb dist/*.rpm dist/release/*.zip dist/release/*.tar.gz dist/assets/
          if [[ -f dist/windows-signing-certificate.pem ]]; then
            cp dist/windows-signing-certificate.pem dist/assets/
          fi
      - name: Sign updater packages with existing certificate
        if: inputs.sign_updates
        env:
          WINDOWS_SIGNING_MODE: ${{ inputs.signing_mode }}
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: docker compose -f docker/docker-compose.yml exec -T -e WINDOWS_SIGNING_MODE -e WINDOWS_SIGNING_PFX_BASE64 -e WINDOWS_SIGNING_PASSWORD go bash scripts/sign-update-packages.sh sign dist/assets
      - name: Check final updater signatures
        if: inputs.sign_updates
        run: docker compose -f docker/docker-compose.yml exec -T go bash scripts/sign-update-packages.sh verify dist/assets
      - name: Prepare retained native package fixtures
        if: inputs.previous_version != ''
        env:
          NATIVE_PREVIOUS_VERSION: ${{ inputs.previous_version }}
          NATIVE_SELECTED_VERSION: ${{ inputs.version }}
        run: |
          docker compose -f docker/docker-compose.yml exec -T -e GITHUB_ACTIONS=true \
            -e NATIVE_PREVIOUS_VERSION -e NATIVE_SELECTED_VERSION \
            go go test -tags nativeacceptance ./internal/ship/updatetransport -run '^TestPrepareNativeAcceptancePackages$' -count=1 -v
      - name: Calculate final checksums after signatures
        run: |
          cd dist/assets
          sha256sum -- * > checksums.txt
      - name: Upload installable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: garminctl-packages
          path: dist/assets/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 7 }}
          compression-level: 0
      - name: Remove signing material
        if: always()
        run: |
          if [[ -d .cache/windows-signing ]]; then
            find .cache/windows-signing -type f -delete
          fi
      - name: Retain previous native packages for manual upgrade checks
        if: inputs.previous_version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: garminctl-previous-native-packages
          path: dist/previous/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain offline Application catalog metadata
        if: inputs.previous_version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: garminctl-native-package-catalog
          path: dist/native-package-catalog/*/*/entry.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    name: Install and run on Windows
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: garminctl-packages
          path: dist/smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.previous_version != ''
        with:
          name: garminctl-previous-native-packages
          path: dist/previous
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.previous_version != ''
        with:
          name: garminctl-native-package-catalog
          path: dist/native-package-catalog
      - name: Install, exercise native app and MCP, uninstall
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          $setup = (Get-ChildItem dist/smoke/*_setup.exe).FullName
          $env:NATIVE_RESULTS_DIR = Join-Path $pwd 'dist/native-results'
          if ($env:PREVIOUS_VERSION) {
            $previous = @(Get-ChildItem dist/previous/*_setup.exe)
            if ($previous.Count -ne 1) { throw 'Expected exactly one previous Setup.' }
            ./tests/native/test-windows-package.ps1 -Setup $setup -Version $env:PACKAGE_VERSION -PreviousSetup $previous[0].FullName -PreviousVersion $env:PREVIOUS_VERSION -RequireSignature:($env:SIGNING_MODE -eq 'certificate')
          } else {
            ./tests/native/test-windows-package.ps1 -Setup $setup -Version $env:PACKAGE_VERSION -RequireSignature:($env:SIGNING_MODE -eq 'certificate')
          }
      - name: Retain native acceptance traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-acceptance-windows
          path: dist/native-results/
          retention-days: 7

  linux:
    name: Install and run on ${{ matrix.distribution }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: Ubuntu 24.04
            image: ubuntu:24.04
            format: deb
          - distribution: Fedora 44
            image: fedora:44
            format: rpm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: garminctl-packages
          path: dist/smoke
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.previous_version != ''
        with:
          name: garminctl-previous-native-packages
          path: dist/previous
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: inputs.previous_version != ''
        with:
          name: garminctl-native-package-catalog
          path: dist/native-package-catalog
      - name: Install package in clean userspace and exercise native app and MCP
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_FORMAT: ${{ matrix.format }}
          TEST_IMAGE: ${{ matrix.image }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: |
          package=$(find dist/smoke -maxdepth 1 -name "*.$PACKAGE_FORMAT" -print -quit)
          previous=()
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            previous_package=$(find dist/previous -maxdepth 1 -name "*.$PACKAGE_FORMAT" -print -quit)
            test -n "$previous_package"
            previous=("/src/$previous_package" "$PREVIOUS_VERSION")
          fi
          mkdir -p dist/native-results
          docker run --rm --init --mount "type=bind,src=$PWD,target=/src,readonly" \
            --mount "type=bind,src=$PWD/dist/native-results,target=/evidence" \
            -e NATIVE_RESULTS_DIR=/evidence -e GITHUB_ACTIONS "$TEST_IMAGE" \
            bash /src/tests/native/test-linux-package.sh "$PACKAGE_FORMAT" "/src/$package" "$PACKAGE_VERSION" "${previous[@]}"
      - name: Retain native acceptance traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-acceptance-${{ matrix.format }}
          path: dist/native-results/
          retention-days: 7
