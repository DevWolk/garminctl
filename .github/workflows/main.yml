name: Main

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: main
  cancel-in-progress: true

jobs:
  windows:
    uses: ./.github/workflows/windows-tests.yml

  # The pull request already built and installed the packages; a release tag
  # builds them again.
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build toolchain and run quality gate
        run: |
          make image-build
          make check

  codeql:
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
