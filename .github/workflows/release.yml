name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Test build version (manual runs do not publish a release)
        required: true
        default: v0.5.0-test
      previous_version:
        description: Optional first version for native package upgrade/rollback (same source; no publication)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  source:
    name: Verify release commit is the tip of main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # An older commit of main under a new tag would publish old code as a new version.
      - name: Require tagged commit to be the tip of main
        if: github.event_name == 'push'
        run: |
          tagged=$(git rev-parse "$GITHUB_SHA^{commit}")
          tip=$(git rev-parse origin/main)
          if [[ "$tagged" != "$tip" ]]; then
            echo "The tag points at $tagged, main is at $tip; tag the tip of main." >&2
            exit 1
          fi
      # Manual builds are signed with the release certificate as well.
      - name: Require manual builds to run from main
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main

  packages:
    name: Verify release packages
    needs: source
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      previous_version: ${{ github.event_name == 'workflow_dispatch' && inputs.previous_version || '' }}
      snapshot: ${{ github.event_name != 'push' }}
      signing_mode: ${{ vars.WINDOWS_SIGNING_MODE || 'none' }}
      sign_updates: true
    secrets:
      WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}

  publish:
    name: Publish verified assets
    if: github.event_name == 'push'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: garminctl-packages
          path: dist/assets
      - name: Check final assets and publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist/assets
          sha256sum --check checksums.txt
          bash "$GITHUB_WORKSPACE/scripts/sign-update-packages.sh" verify "$GITHUB_WORKSPACE/dist/assets"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" "${prerelease[@]}" ./*
