name: garminctl

services:
  go:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        UID: "${HOST_UID:-1000}"
        GID: "${HOST_GID:-1000}"
    image: garminctl-build:local
    init: true
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /src
    command: ["bash"]
    stdin_open: true
    tty: true
    environment:
      GOCACHE: /src/.cache/go-build
      GOMODCACHE: /src/.cache/go-mod
      GOTOOLCHAIN: local
    volumes:
      - ../:/src
