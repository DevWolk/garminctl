version: 2

project_name: garminctl
# Keep Make-generated installers outside the directory cleaned by GoReleaser.
dist: dist/release

builds:
  - main: ./cmd/garminctl
    env:
      - CGO_ENABLED=0
    # Portable archives use WPD on Windows/WSL or directory dumps. The native
    # Linux USB CLI is built separately and included in the DEB/RPM packages.
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    hooks:
      post:
        - cmd: 'bash scripts/sign-release-binary.sh "{{ .Os }}" "{{ .Path }}"'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - docs/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
