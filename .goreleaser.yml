version: 2

project_name: garminctl
# Keep Make-generated installers outside the directory cleaned by GoReleaser.
dist: dist/release

snapshot:
  version_template: "{{ .Env.PACKAGE_VERSION_NO_V }}"

builds:
  - main: ./cmd/garminctl
    env:
      - CGO_ENABLED=0
    # Portable archives use WPD on Windows/WSL or directory dumps. The native
    # Linux USB CLI is built separately and included in the DEB/RPM packages.
    goos:
      - windows
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      # Same string as the Make-built package binaries, which keep the tag's v.
      - -X main.version={{ .Env.PACKAGE_VERSION }}
      - -X main.updatePublicKey={{ .Env.APPLICATION_UPDATE_PUBLIC_KEY }}
      - -X github.com/DevWolk/garminctl/internal/ship/gc.buildConsumerKey={{ envOrDefault "GARMIN_OAUTH_CONSUMER_KEY" "" }}
      - -X github.com/DevWolk/garminctl/internal/ship/gc.buildConsumerSecret={{ envOrDefault "GARMIN_OAUTH_CONSUMER_SECRET" "" }}
    hooks:
      post:
        - cmd: 'bash scripts/sign-release-binary.sh "{{ .Os }}" "{{ .Path }}"'

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The application's staging accepts an archive with exactly one top-level entry.
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
